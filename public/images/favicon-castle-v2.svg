<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">

  <!-- === MAIN FRONT WALL === -->
  <rect x="14" y="34" width="36" height="26" fill="#C8D3DC"/>
  <!-- Battlements on main wall -->
  <rect x="14" y="31" width="5" height="4" fill="#C8D3DC"/>
  <rect x="23" y="31" width="5" height="4" fill="#C8D3DC"/>
  <rect x="36" y="31" width="5" height="4" fill="#C8D3DC"/>
  <rect x="45" y="31" width="5" height="4" fill="#C8D3DC"/>

  <!-- Main wall windows -->
  <rect x="17" y="40" width="5" height="7" rx="2.5" fill="#8C9BAA"/>
  <rect x="42" y="40" width="5" height="7" rx="2.5" fill="#8C9BAA"/>

  <!-- === CENTER TOWER === -->
  <rect x="21" y="16" width="22" height="30" fill="#D9E2E9"/>
  <!-- Center tower battlements -->
  <rect x="21" y="13" width="5" height="4" fill="#D9E2E9"/>
  <rect x="28" y="13" width="8" height="4" fill="#D9E2E9"/>
  <rect x="38" y="13" width="5" height="4" fill="#D9E2E9"/>

  <!-- Center tower roof -->
  <polygon points="20,16 32,2 44,16" fill="#E74C3C"/>
  <!-- Center flag pole -->
  <line x1="32" y1="-2" x2="32" y2="4" stroke="#999" stroke-width="1"/>
  <!-- Center flag -->
  <polygon points="32,-2 37,0 32,2" fill="#E74C3C"/>

  <!-- Center tower windows -->
  <rect x="24" y="20" width="5" height="7" rx="2.5" fill="#8C9BAA"/>
  <rect x="35" y="20" width="5" height="7" rx="2.5" fill="#8C9BAA"/>
  <rect x="29" y="32" width="6" height="8" rx="3" fill="#8C9BAA"/>

  <!-- === LEFT TOWER === -->
  <rect x="6" y="22" width="14" height="38" fill="#D9E2E9"/>
  <!-- Left tower battlements -->
  <rect x="6" y="19" width="4" height="4" fill="#D9E2E9"/>
  <rect x="12" y="19" width="4" height="4" fill="#D9E2E9"/>
  <!-- Left tower side accent -->
  <rect x="6" y="22" width="2" height="38" fill="#C8D3DC"/>

  <!-- Left roof -->
  <polygon points="4,22 13,8 22,22" fill="#E74C3C"/>
  <!-- Left flag pole -->
  <line x1="13" y1="4" x2="13" y2="10" stroke="#999" stroke-width="1"/>
  <!-- Left flag -->
  <polygon points="13,4 18,6 13,8" fill="#E74C3C"/>

  <!-- Left tower windows -->
  <rect x="9" y="26" width="5" height="7" rx="2.5" fill="#8C9BAA"/>
  <rect x="9" y="38" width="5" height="7" rx="2.5" fill="#8C9BAA"/>
  <rect x="9" y="50" width="5" height="7" rx="2.5" fill="#8C9BAA"/>

  <!-- === RIGHT TOWER === -->
  <rect x="44" y="22" width="14" height="38" fill="#D9E2E9"/>
  <!-- Right tower battlements -->
  <rect x="48" y="19" width="4" height="4" fill="#D9E2E9"/>
  <rect x="44" y="19" width="4" height="4" fill="#D9E2E9"/>
  <!-- Right tower side accent -->
  <rect x="56" y="22" width="2" height="38" fill="#C8D3DC"/>

  <!-- Right roof -->
  <polygon points="42,22 51,8 60,22" fill="#E74C3C"/>
  <!-- Right flag pole -->
  <line x1="51" y1="4" x2="51" y2="10" stroke="#999" stroke-width="1"/>
  <!-- Right flag -->
  <polygon points="51,4 56,6 51,8" fill="#E74C3C"/>

  <!-- Right tower windows -->
  <rect x="49" y="26" width="5" height="7" rx="2.5" fill="#8C9BAA"/>
  <rect x="49" y="38" width="5" height="7" rx="2.5" fill="#8C9BAA"/>
  <rect x="49" y="50" width="5" height="7" rx="2.5" fill="#8C9BAA"/>

  <!-- === MAIN DOOR === -->
  <rect x="27" y="48" width="10" height="14" rx="5" fill="#A0694B"/>

</svg>
