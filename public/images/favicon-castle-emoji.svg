<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Sky gradient background (optional, can remove) -->
  
  <!-- Left tower -->
  <rect x="2" y="10" width="8" height="18" rx="1" fill="#F6A623"/>
  <!-- Left tower roof -->
  <polygon points="1,10 6,2 11,10" fill="#E74C3C"/>
  <!-- Left tower battlements -->
  <rect x="2" y="9" width="2.5" height="2.5" fill="#F6A623"/>
  <rect x="7.5" y="9" width="2.5" height="2.5" fill="#F6A623"/>
  
  <!-- Right tower -->
  <rect x="22" y="10" width="8" height="18" rx="1" fill="#F6A623"/>
  <!-- Right tower roof -->
  <polygon points="21,10 26,2 31,10" fill="#E74C3C"/>
  <!-- Right tower battlements -->
  <rect x="22" y="9" width="2.5" height="2.5" fill="#F6A623"/>
  <rect x="27.5" y="9" width="2.5" height="2.5" fill="#F6A623"/>
  
  <!-- Main wall -->
  <rect x="8" y="14" width="16" height="14" fill="#F5B731"/>
  
  <!-- Center tower -->
  <rect x="10" y="8" width="12" height="12" rx="1" fill="#F6A623"/>
  <!-- Center roof -->
  <polygon points="9,8 16,0 23,8" fill="#E74C3C"/>
  <!-- Center battlements -->
  <rect x="10" y="7" width="3" height="2.5" fill="#F6A623"/>
  <rect x="19" y="7" width="3" height="2.5" fill="#F6A623"/>

  <!-- Flag pole -->
  <line x1="16" y1="-1" x2="16" y2="2" stroke="#8B5E3C" stroke-width="1"/>
  <!-- Flag -->
  <polygon points="16,-1 21,1 16,3" fill="#3498DB"/>
  
  <!-- Windows - left tower -->
  <rect x="4" y="13" width="3" height="4" rx="1.5" fill="#3498DB"/>
  <rect x="4" y="20" width="3" height="4" rx="1.5" fill="#3498DB"/>
  
  <!-- Windows - right tower -->
  <rect x="25" y="13" width="3" height="4" rx="1.5" fill="#3498DB"/>
  <rect x="25" y="20" width="3" height="4" rx="1.5" fill="#3498DB"/>
  
  <!-- Windows - center tower -->
  <circle cx="13.5" cy="12" r="2" fill="#3498DB"/>
  <circle cx="18.5" cy="12" r="2" fill="#3498DB"/>
  
  <!-- Main door -->
  <rect x="12.5" y="21" width="7" height="9" rx="3.5" fill="#8B4513"/>
  <!-- Door handle -->
  <circle cx="17.5" cy="26" r="0.8" fill="#F6A623"/>
  
  <!-- Door line -->
  <line x1="16" y1="21" x2="16" y2="30" stroke="#6B3410" stroke-width="0.5"/>
  
  <!-- Brick details on wall -->
  <line x1="8" y1="18" x2="12.5" y2="18" stroke="#E5A520" stroke-width="0.4"/>
  <line x1="19.5" y1="18" x2="24" y2="18" stroke="#E5A520" stroke-width="0.4"/>
  <line x1="8" y1="24" x2="12.5" y2="24" stroke="#E5A520" stroke-width="0.4"/>
  <line x1="19.5" y1="24" x2="24" y2="24" stroke="#E5A520" stroke-width="0.4"/>
</svg>
